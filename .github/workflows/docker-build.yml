name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
    paths:
      - "backend/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry"
        required: false
        default: false
        type: boolean
      platforms:
        description: "Build platforms (comma-separated)"
        required: false
        default: "linux/amd64"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Prepare build metadata and version information
  # ============================================================================
  prepare:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_push: ${{ steps.push_decision.outputs.should_push }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      build_date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Extract version from pyproject.toml
        id: version
        working-directory: backend
        run: |
          VERSION=$(grep '^version' pyproject.toml | cut -d '"' -f 2 || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Get build date
        id: date
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Build Date: $BUILD_DATE"

      - name: Determine if images should be pushed
        id: push_decision
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]] && \
             ([[ "${{ github.ref }}" == "refs/heads/main" ]] || \
              [[ "${{ github.ref }}" == "refs/heads/develop" ]] || \
              [[ "${{ github.ref }}" =~ ^refs/tags/.* ]] || \
              [[ "${{ github.event.inputs.push_images }}" == "true" ]]); then
            echo "should_push=true" >> $GITHUB_OUTPUT
            echo "Images will be pushed to registry"
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
            echo "Images will be built but not pushed"
          fi

      - name: Determine build platforms
        id: platforms
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ -n "${{ github.event.inputs.platforms }}" ]]; then
            echo "platforms=${{ github.event.inputs.platforms }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ ^refs/tags/.* ]]; then
            # Multi-platform for releases
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            # Single platform for development
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          fi
          echo "Platforms: $(cat $GITHUB_OUTPUT | grep platforms | cut -d= -f2)"

  # ============================================================================
  # Build and push Docker images
  # ============================================================================
  build:
    name: Build ${{ matrix.image.name }} Image
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
      security-events: write # For uploading SARIF results
      id-token: write # For signing images with cosign

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            target: api
            description: "FastAPI service for financial data extraction"
          - name: worker
            target: worker
            description: "Celery worker for background tasks"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # ============================================================================
      # Generate comprehensive image metadata
      # ============================================================================
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image.name }}
          tags: |
            # Git branch
            type=ref,event=branch
            # Pull request
            type=ref,event=pr
            # Semver from tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Version from pyproject.toml
            type=raw,value=${{ needs.prepare.outputs.version }}
            # SHA
            type=sha,prefix={{branch}}-
            # Latest tag for main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Financial Data Extractor ${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.vendor=PatrykQuantumNomad
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      # ============================================================================
      # Authentication
      # ============================================================================
      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.should_push == 'true'
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================================
      # Build and push image
      # ============================================================================
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: ${{ matrix.image.target }}
          push: ${{ needs.prepare.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ needs.prepare.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.prepare.outputs.version }}
          # Generate provenance attestation
          provenance: true
          # Generate SBOM (Software Bill of Materials)
          sbom: true

      - name: Output image digest
        run: |
          echo "### Image Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ matrix.image.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-and-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # ============================================================================
      # Security scanning with Trivy
      # ============================================================================
      - name: Run Trivy vulnerability scanner
        if: needs.prepare.outputs.should_push == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-and-push.outputs.digest }}
          format: "sarif"
          output: "trivy-results-${{ matrix.image.name }}.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.31.2
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.image.name }}.sarif"
          category: "trivy-${{ matrix.image.name }}"
        continue-on-error: true

      # ============================================================================
      # Image signing with Cosign (optional, requires setup)
      # ============================================================================
      - name: Install Cosign
        if: needs.prepare.outputs.should_push == 'true' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign container image
        if: needs.prepare.outputs.should_push == 'true' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image.name }}@${DIGEST}
        continue-on-error: true

  # ============================================================================
  # Summary and notifications
  # ============================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    steps:
      - name: Generate Build Summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** \`${{ needs.prepare.outputs.build_date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** \`${{ needs.prepare.outputs.platforms }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pushed:** \`${{ needs.prepare.outputs.should_push }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏗️  Images Built:" >> $GITHUB_STEP_SUMMARY
          echo "- **FastAPI API:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Celery Worker:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "### Status: Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All images built successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Status: Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.prepare.outputs.should_push }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Pull Images" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report build failure
        if: needs.build.result == 'failure'
        run: |
          echo "Docker image build failed!"
          exit 1
